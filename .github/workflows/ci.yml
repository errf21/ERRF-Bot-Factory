name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: errf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npx --no-install wrangler d1 migrations apply DB --local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-build-${{ github.sha }}
          path: dist/
          retention-days: 14
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ALLOW_PRODUCTION_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: errf-cloudflare-production
      cancel-in-progress: false
    env:
      ERRF_ALLOW_REMOTE_DEPLOYMENT: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      PANEL_ALLOWED_HOSTS: ${{ vars.PANEL_ALLOWED_HOSTS }}
      KEY_VERSION: ${{ vars.KEY_VERSION }}
      FACTORY_OPEN_REGISTRATION: ${{ vars.FACTORY_OPEN_REGISTRATION }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run deploy
      - name: Deployment summary
        if: always()
        run: |
          echo "### ERRF Cloudflare deployment: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA. Inspect the failed step for diagnostics. No automatic rollback or database reset is performed." >> "$GITHUB_STEP_SUMMARY"
